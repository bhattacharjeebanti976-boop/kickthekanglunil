<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KICK THE KANGLUNIL</title>
<style>
  :root {
    --ink:#14121a; --paper:#f5ecd7; --red:#e63946; --yellow:#ffd23f; --teal:#2ec4b6; --shadow:4px 4px 0 var(--ink);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--ink); color:var(--ink);
    font-family:"Arial Black","Impact","Helvetica Neue",Arial,sans-serif; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  /* title sticker */
  #title { position:fixed; top:10px; left:12px; background:var(--yellow); border:3px solid var(--ink);
    box-shadow:var(--shadow); padding:5px 12px 4px; transform:rotate(-2deg); pointer-events:none;
    font-size:clamp(14px,3.6vw,28px); letter-spacing:.5px; text-transform:uppercase; line-height:1; }
  #title small { display:block; font-family:Arial,sans-serif; font-weight:700; font-size:.38em; letter-spacing:2px; margin-top:3px; }

  /* score */
  #score-card { position:fixed; top:10px; right:12px; background:var(--paper); border:3px solid var(--ink);
    box-shadow:var(--shadow); padding:6px 12px; text-align:right; min-width:120px; pointer-events:none; }
  #score-card .lbl { font:700 10px Arial,sans-serif; letter-spacing:2px; opacity:.6; }
  #score { font-size:clamp(24px,6vw,38px); line-height:1; }
  #score-card .row { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-top:4px; font:700 12px Arial,sans-serif; }
  #combo { background:var(--red); color:#fff; padding:2px 7px; border:2px solid var(--ink); transform:rotate(2deg); transition:transform .1s; font-family:"Arial Black",Arial,sans-serif; font-size:12px; }

  /* small buttons */
  #mini { position:fixed; top:112px; right:12px; display:flex; gap:6px; }
  .mini { background:var(--paper); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); padding:5px 9px;
    font:900 12px "Arial Black",Arial,sans-serif; text-transform:uppercase; cursor:pointer; color:var(--ink); }
  .mini:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .mini.on { background:var(--teal); }

  /* weapon tray */
  #tray { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); display:flex; gap:6px;
    max-width:98vw; overflow-x:auto; padding:6px 8px 10px; }
  .tile { position:relative; flex:0 0 auto; width:62px; height:70px; background:var(--paper); border:3px solid var(--ink);
    box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    transition:transform .08s; color:var(--ink); padding:0; }
  .tile svg { width:30px; height:30px; }
  .tile span.n { font:900 9px Arial,sans-serif; text-transform:uppercase; letter-spacing:.5px; }
  .tile i { position:absolute; top:1px; left:4px; font:900 9px Arial,sans-serif; font-style:normal; opacity:.5; }
  .tile.active { background:var(--yellow); transform:translateY(-8px) rotate(-2deg); box-shadow:5px 7px 0 var(--ink); }
  .tile:active { transform:translate(2px,2px); }

  /* customize drawer */
  #drawer { position:fixed; top:150px; right:12px; width:230px; max-height:calc(100vh - 260px); overflow-y:auto;
    background:var(--paper); border:3px solid var(--ink); box-shadow:var(--shadow); padding:10px 12px;
    font:700 13px Arial,sans-serif; display:none; }
  #drawer.open { display:block; }
  #drawer h4 { margin:8px 0 4px; font:900 11px "Arial Black",Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; border-bottom:2px solid var(--ink); }
  #drawer h4:first-child { margin-top:0; }
  #drawer label { display:flex; justify-content:space-between; align-items:center; margin:5px 0; gap:8px; }
  #drawer input[type=color] { width:38px; height:26px; border:2px solid var(--ink); padding:0; background:none; }
  #drawer input[type=checkbox] { width:20px; height:20px; accent-color:var(--ink); }
  #drawer select { background:#fff; color:var(--ink); border:2px solid var(--ink); padding:3px; font:700 12px Arial,sans-serif; }

  .pop { position:fixed; pointer-events:none; font:900 clamp(22px,5.5vw,38px) "Arial Black",Impact,sans-serif; color:#fff;
    -webkit-text-stroke:2.5px var(--ink); paint-order:stroke fill; text-shadow:3px 3px 0 var(--ink);
    animation:pop .8s ease-out forwards; transform:translate(-50%,-50%); }
  @keyframes pop { 0%{opacity:1; transform:translate(-50%,-50%) scale(.4) rotate(-8deg);}
    25%{transform:translate(-50%,-80%) scale(1.3) rotate(5deg);} 100%{opacity:0; transform:translate(-50%,-230%) scale(1) rotate(-3deg);} }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--ink); color:var(--yellow);
    font-size:22px; z-index:10; transition:opacity .4s; }
  @media (max-width:560px){ #drawer{ top:auto; bottom:92px; right:8px; width:210px; max-height:45vh; } .tile{ width:56px; height:64px; } }
</style>
</head>
<body>
<div id="loading">LOADING...</div>
<div id="title">Kick the Kanglunil<small>stress relief simulator</small></div>
<div id="score-card">
  <div class="lbl">SCORE</div><div id="score">0</div>
  <div class="row"><span>BEST <b id="best">0</b></span><span id="combo">x1</span></div>
</div>
<div id="mini">
  <button class="mini" id="btnCustom">Dress-up</button>
  <button class="mini" id="btnReset">Reset</button>
  <button class="mini on" id="btnSound">Sound</button>
</div>
<div id="drawer">
  <h4>Colors</h4>
  <label>Jacket <input type="color" id="cJacket" value="#1f5fd1"></label>
  <label>Hair <input type="color" id="cHair" value="#1a1a1a"></label>
  <label>Pants <input type="color" id="cPants" value="#2b2b3a"></label>
  <label>Skin <input type="color" id="cSkin" value="#e8b48a"></label>
  <h4>Face</h4>
  <label>Hairstyle
    <select id="sHair"><option value="spiky">Spiky</option><option value="swept">Swept</option><option value="buzz">Buzz cut</option><option value="bald">Bald</option></select></label>
  <label>Eyebrows
    <select id="sBrow"><option value="normal">Normal</option><option value="thick">Thick</option><option value="angry">Angry</option></select></label>
  <label>Mustache <input type="checkbox" id="kMustache" checked></label>
  <label>Goatee <input type="checkbox" id="kGoatee"></label>
  <label>Glasses <input type="checkbox" id="kGlasses"></label>
  <h4>Hat</h4>
  <label>Cap <input type="checkbox" id="kCap"></label>
  <label>Cap color <input type="color" id="cCap" value="#d32f2f"></label>
</div>
<div id="tray"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ---------- basic setup ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2040);
scene.fog = new THREE.Fog(0x2a2040, 14, 30);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
const camBase = new THREE.Vector3(0, 2.6, 8.2);
const camLook = new THREE.Vector3(0, 1.5, 0);

scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x3a2f2a, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(4, 8, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left:-8, right:8, top:8, bottom:-4, near:1, far:25 });
scene.add(sun);

/* ---------- room ---------- */
const ROOM = { w: 5, h: 6, d: 2.2 };
function addBox(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: .9 }));
  m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
}
addBox(ROOM.w * 2 + 1, 0.4, 8, 0x7a5638, 0, -0.2, 0);                       // floor
addBox(ROOM.w * 2 + 1, ROOM.h, 0.3, 0x5a4a86, 0, ROOM.h / 2, -ROOM.d - 0.15); // back wall
addBox(0.3, ROOM.h, 8, 0x4a3d73, -ROOM.w - 0.15, ROOM.h / 2, 0);              // left wall
addBox(0.3, ROOM.h, 8, 0x4a3d73, ROOM.w + 0.15, ROOM.h / 2, 0);               // right wall
for (let i = -4; i <= 4; i += 2) addBox(0.5, ROOM.h, 0.05, 0x6a5a9c, i, ROOM.h / 2, -ROOM.d);
addBox(2.2, 1.4, 0.08, 0xffd23f, -2.8, 3.6, -ROOM.d + 0.06);
addBox(2.0, 1.2, 0.1, 0x7fd0ff, -2.8, 3.6, -ROOM.d + 0.08);
addBox(1.2, 0.08, 0.5, 0xffd23f, 2.8, 2.8, -ROOM.d + 0.25);                    // shelf

/* ---------- physics ---------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -22, 0) });
world.solver.iterations = 14;
world.allowSleep = false;
const matWorld = new CANNON.Material('world');
const matBody = new CANNON.Material('body');
world.addContactMaterial(new CANNON.ContactMaterial(matWorld, matBody, { friction: 0.45, restitution: 0.38 }));

function staticPlane(pos, axis, angle) {
  const b = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: matWorld,
    collisionFilterGroup: 1, collisionFilterMask: 2 });
  b.quaternion.setFromAxisAngle(axis, angle); b.position.copy(pos); world.addBody(b); return b;
}
staticPlane(new CANNON.Vec3(0, 0, 0), new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
staticPlane(new CANNON.Vec3(0, ROOM.h, 0), new CANNON.Vec3(1, 0, 0), Math.PI / 2);
staticPlane(new CANNON.Vec3(0, 0, -ROOM.d), new CANNON.Vec3(0, 1, 0), 0);
staticPlane(new CANNON.Vec3(0, 0, ROOM.d), new CANNON.Vec3(0, 1, 0), Math.PI);
staticPlane(new CANNON.Vec3(-ROOM.w, 0, 0), new CANNON.Vec3(0, 1, 0), Math.PI / 2);
staticPlane(new CANNON.Vec3(ROOM.w, 0, 0), new CANNON.Vec3(0, 1, 0), -Math.PI / 2);

/* ---------- character (original cartoon dummy) ---------- */
const look = { jacket: '#1f5fd1', hair: '#1a1a1a', pants: '#2b2b3a', skin: '#e8b48a',
  hairStyle: 'spiky', brow: 'normal', mustache: true, goatee: false, glasses: false, cap: false, capColor: '#d32f2f' };
let parts = [];
let joints = [];
let head = null, mouth = null;
const hitMeshes = [];

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .65 });

function clearCharacter() {
  parts.forEach(p => { world.removeBody(p.body); scene.remove(p.group); });
  joints.forEach(j => world.removeConstraint(j));
  parts = []; joints = []; hitMeshes.length = 0;
}

function addPart(name, half, pos, mass, group, isSphere = false) {
  const shape = isSphere ? new CANNON.Sphere(half[0]) : new CANNON.Box(new CANNON.Vec3(...half));
  const body = new CANNON.Body({ mass, shape, material: matBody, position: new CANNON.Vec3(...pos),
    linearDamping: 0.12, angularDamping: 0.55, collisionFilterGroup: 2, collisionFilterMask: 1 });
  world.addBody(body);
  group.position.set(...pos);
  group.traverse(o => { if (o.isMesh) { o.castShadow = true; o.userData.body = body; hitMeshes.push(o); } });
  scene.add(group);
  const p = { name, body, group }; parts.push(p); return p;
}

function joint(a, b, wx, wy, wz) {
  const w = new CANNON.Vec3(wx, wy, wz);
  const c = new CANNON.PointToPointConstraint(a.body, w.vsub(a.body.position), b.body, w.vsub(b.body.position));
  world.addConstraint(c); joints.push(c);
}

function buildCharacter(offsetX = 0, offsetY = 0) {
  clearCharacter();
  const skin = mat(look.skin), jacket = mat(look.jacket), pants = mat(look.pants),
        hair = mat(look.hair), white = mat(0xffffff), shoe = mat(0xf2f2f2), dark = mat(0x111111);
  const X = offsetX, Y = offsetY;

  const hg = new THREE.Group();
  hg.add(new THREE.Mesh(new THREE.SphereGeometry(0.28, 28, 20), skin));
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), white);
    eye.position.set(0.11 * s, 0.05, 0.23); hg.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), dark);
    pupil.position.set(0.11 * s, 0.05, 0.295); hg.add(pupil);
    const thick = look.brow === 'thick', angry = look.brow === 'angry';
    const brow = new THREE.Mesh(new THREE.BoxGeometry(thick ? 0.15 : 0.12, thick ? 0.05 : 0.025, 0.03), hair);
    brow.position.set(0.11 * s, 0.15, 0.25); brow.rotation.z = (angry ? 0.45 : thick ? 0.1 : -0.15) * s; hg.add(brow);
    if (look.glasses) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.095, 0.014, 8, 24), dark);
      ring.position.set(0.11 * s, 0.05, 0.27); hg.add(ring);
    }
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), skin);
    ear.position.set(0.28 * s, 0, 0); hg.add(ear);
  }
  mouth = new THREE.Mesh(new THREE.SphereGeometry(0.07, 14, 10), mat(0x5a1515));
  mouth.position.set(0, -0.12, 0.24); mouth.scale.set(1.3, .45, .6); hg.add(mouth);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 8), skin);
  nose.position.set(0, -0.02, 0.28); hg.add(nose);

  const style = look.cap ? 'cap' : look.hairStyle;
  if (style === 'spiky') {
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2, r = i === 0 ? 0 : 0.17;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.22, 8), hair);
      cone.position.set(Math.cos(a) * r, 0.3, Math.sin(a) * r - 0.02);
      cone.rotation.set(Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35);
      hg.add(cone);
    }
  }
  if (style === 'swept') {
    for (let i = 0; i < 6; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.26, 8), hair);
      cone.position.set(-0.17 + i * 0.07, 0.3, 0.1 - (i % 2) * 0.12);
      cone.rotation.set(0.5, 0, -1.0);
      hg.add(cone);
    }
  }
  if (style !== 'bald' && style !== 'cap') {
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.29, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.42), hair);
    dome.position.y = 0.02; dome.rotation.x = -0.25; hg.add(dome);
  }
  if (style === 'cap') {
    const capMat = mat(look.capColor);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.31, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.5), capMat);
    dome.position.y = 0.06; hg.add(dome);
    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.03, 0.26), capMat);
    brim.position.set(0, 0.1, 0.3); brim.rotation.x = 0.15; hg.add(brim);
  }
  if (look.mustache) {
    for (const s of [-1, 1]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.04), hair);
      m.position.set(0.055 * s, -0.075, 0.27); m.rotation.z = -0.2 * s; hg.add(m);
    }
  }
  if (look.goatee) {
    const g = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.09, 0.04), hair);
    g.position.set(0, -0.21, 0.23); hg.add(g);
  }
  if (look.glasses) {
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.014, 0.014), dark);
    bridge.position.set(0, 0.06, 0.27); hg.add(bridge);
  }
  head = addPart('head', [0.28], [X, Y + 2.25, 0], 3, hg, true);

  const tg = new THREE.Group();
  tg.add(new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.7, 0.3), jacket));
  const zip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.7, 0.02), white); zip.position.z = 0.16; tg.add(zip);
  const collar = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.32), white); collar.position.y = 0.37; tg.add(collar);
  const torso = addPart('torso', [0.26, 0.35, 0.15], [X, Y + 1.6, 0], 6, tg);

  const pg = new THREE.Group();
  pg.add(new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.26, 0.28), pants));
  const pelvis = addPart('pelvis', [0.24, 0.13, 0.14], [X, Y + 1.12, 0], 5, pg);

  function limb(name, len, rad, m, pos, material, extra) {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.CapsuleGeometry(rad, len - rad * 2, 6, 12), material));
    if (extra) extra(g, len);
    return addPart(name, [rad, len / 2, rad], pos, m, g);
  }
  const hand = (g, len) => { const h = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), skin); h.position.y = -len / 2; g.add(h); };
  const foot = (g, len) => { const f = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.34), shoe); f.position.set(0, -len / 2 + 0.03, 0.08); g.add(f); };

  const uaL = limb('uaL', 0.4, 0.08, 1.4, [X - 0.4, Y + 1.65, 0], jacket);
  const uaR = limb('uaR', 0.4, 0.08, 1.4, [X + 0.4, Y + 1.65, 0], jacket);
  const laL = limb('laL', 0.4, 0.07, 1.0, [X - 0.4, Y + 1.25, 0], skin, hand);
  const laR = limb('laR', 0.4, 0.07, 1.0, [X + 0.4, Y + 1.25, 0], skin, hand);
  const ulL = limb('ulL', 0.5, 0.1, 2.2, [X - 0.13, Y + 0.75, 0], pants);
  const ulR = limb('ulR', 0.5, 0.1, 2.2, [X + 0.13, Y + 0.75, 0], pants);
  const llL = limb('llL', 0.5, 0.09, 1.8, [X - 0.13, Y + 0.25, 0], pants, foot);
  const llR = limb('llR', 0.5, 0.09, 1.8, [X + 0.13, Y + 0.25, 0], pants, foot);

  joint(head, torso, X, Y + 1.97, 0);
  joint(torso, pelvis, X, Y + 1.25, 0);
  joint(torso, uaL, X - 0.4, Y + 1.85, 0);
  joint(torso, uaR, X + 0.4, Y + 1.85, 0);
  joint(uaL, laL, X - 0.4, Y + 1.45, 0);
  joint(uaR, laR, X + 0.4, Y + 1.45, 0);
  joint(pelvis, ulL, X - 0.13, Y + 1.0, 0);
  joint(pelvis, ulR, X + 0.13, Y + 1.0, 0);
  joint(ulL, llL, X - 0.13, Y + 0.5, 0);
  joint(ulR, llR, X + 0.13, Y + 0.5, 0);

  torso.body.angularVelocity.set(0, 0, (Math.random() - .5) * 1.5);
}
buildCharacter(0, 0.3);

/* ---------- audio (all synthesized, no files) ---------- */
let audioCtx = null, soundOn = true;
function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }

function noiseBuffer(sec) {
  const len = Math.floor(audioCtx.sampleRate * sec), buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function thud(power = 1, kind = 'kick') {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime, g = audioCtx.createGain();
  g.connect(audioCtx.destination);
  const o = audioCtx.createOscillator();
  o.type = kind === 'rocket' ? 'sawtooth' : 'sine';
  o.frequency.setValueAtTime(kind === 'rocket' ? 140 : 190, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
  g.gain.setValueAtTime(Math.min(0.9, 0.3 + power * 0.04), t);
  g.gain.exponentialRampToValueAtTime(0.001, t + (kind === 'rocket' ? 0.6 : 0.3));
  o.connect(g); o.start(t); o.stop(t + 0.65);
  const n = audioCtx.createBufferSource(), ng = audioCtx.createGain();
  n.buffer = noiseBuffer(0.15); ng.gain.setValueAtTime(0.35, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  n.connect(ng); ng.connect(audioCtx.destination); n.start(t);
}
// screaming: a sawtooth "voice" through two moving vowel filters, with vibrato and a breathy noise layer
let lastScream = -1;
function scream(intensity = 1) {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime;
  if (t - lastScream < 0.3) return;
  lastScream = t;
  const k = Math.min(Math.max(intensity, 0.4), 2);
  const dur = 0.5 + k * 0.45;
  const base = 300 + Math.random() * 260;       // random "voice" each time
  const o = audioCtx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(base, t);
  o.frequency.linearRampToValueAtTime(base * (1.9 + Math.random() * 0.6), t + dur * 0.25);
  o.frequency.linearRampToValueAtTime(base * 1.35, t + dur);
  const lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
  lfo.frequency.value = 6 + Math.random() * 4; lg.gain.value = base * 0.05;
  lfo.connect(lg); lg.connect(o.frequency);
  const f1 = audioCtx.createBiquadFilter(), f2 = audioCtx.createBiquadFilter();
  f1.type = f2.type = 'bandpass'; f1.Q.value = 5; f2.Q.value = 6;
  f1.frequency.setValueAtTime(900, t); f1.frequency.linearRampToValueAtTime(600, t + dur);
  f2.frequency.setValueAtTime(1300, t); f2.frequency.linearRampToValueAtTime(1900, t + dur * 0.5);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.04);
  g.gain.setValueAtTime(0.5, t + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g); g.connect(audioCtx.destination);
  const nz = audioCtx.createBufferSource(), nf = audioCtx.createBiquadFilter(), ng = audioCtx.createGain();
  nz.buffer = noiseBuffer(dur); nf.type = 'highpass'; nf.frequency.value = 2500;
  ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.12, t + 0.05); ng.gain.exponentialRampToValueAtTime(0.001, t + dur);
  nz.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination);
  o.start(t); lfo.start(t); nz.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  if (mouth) mouth.userData.t = 1.6;
}
let laserSnd = null;
function startLaserSound() {
  if (!soundOn || !audioCtx || laserSnd) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), o2 = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sawtooth'; o.frequency.value = 130; o2.type = 'square'; o2.frequency.value = 262;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.08);
  o.connect(g); o2.connect(g); g.connect(audioCtx.destination); o.start(t); o2.start(t);
  laserSnd = { o, o2, g };
}
function stopLaserSound() {
  if (!laserSnd) return;
  const t = audioCtx.currentTime;
  laserSnd.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  laserSnd.o.stop(t + 0.12); laserSnd.o2.stop(t + 0.12); laserSnd = null;
}
function zapSound() {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime, n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  n.buffer = noiseBuffer(1.4); f.type = 'bandpass'; f.frequency.value = 3000; f.Q.value = 1.5;
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
  n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start(t);
}

/* ---------- tools ---------- */
const ICON = {
  punch:  '<svg viewBox="0 0 32 32"><rect x="4" y="8" width="19" height="16" rx="8" fill="#e63946" stroke="#14121a" stroke-width="2.5"/><rect x="21" y="11" width="7" height="10" rx="1.5" fill="#f5ecd7" stroke="#14121a" stroke-width="2.5"/></svg>',
  kick:   '<svg viewBox="0 0 32 32"><path d="M5 25V9h8v6l13 3q3 1 3 4v3z" fill="#fff" stroke="#14121a" stroke-width="2.5" stroke-linejoin="round"/><path d="M5 22h24" stroke="#14121a" stroke-width="2.5"/></svg>',
  bat:    '<svg viewBox="0 0 32 32"><path d="M5 27L22 10l3-6 3 3-6 3L8 30z" fill="#c58b4a" stroke="#14121a" stroke-width="2.5" stroke-linejoin="round"/></svg>',
  hammer: '<svg viewBox="0 0 32 32"><path d="M8 28L21 14" stroke="#14121a" stroke-width="5" stroke-linecap="round"/><path d="M8 28L21 14" stroke="#c58b4a" stroke-width="2" stroke-linecap="round"/><rect x="15" y="4" width="14" height="9" rx="1.5" transform="rotate(40 22 8)" fill="#9aa3b5" stroke="#14121a" stroke-width="2.5"/></svg>',
  rocket: '<svg viewBox="0 0 32 32"><path d="M16 2q8 7 6 19h-12q-2-12 6-19z" fill="#fff" stroke="#14121a" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 21l-4 5 6-2zM22 21l4 5-6-2z" fill="#e63946" stroke="#14121a" stroke-width="2"/><path d="M13 23q3 8 6 0z" fill="#ffd23f" stroke="#14121a" stroke-width="2"/><circle cx="16" cy="12" r="2.5" fill="#2ec4b6" stroke="#14121a" stroke-width="2"/></svg>',
  laser:  '<svg viewBox="0 0 32 32"><path d="M3 29L22 10" stroke="#14121a" stroke-width="7" stroke-linecap="round"/><path d="M3 29L22 10" stroke="#e63946" stroke-width="3.5" stroke-linecap="round"/><circle cx="24" cy="8" r="4.5" fill="#fff" stroke="#14121a" stroke-width="2.5"/><path d="M24 1v3M30 8h-3M28 3l-2 2" stroke="#14121a" stroke-width="2.5" stroke-linecap="round"/></svg>',
  zap:    '<svg viewBox="0 0 32 32"><path d="M19 2L7 18h8l-3 12 13-18h-8z" fill="#ffd23f" stroke="#14121a" stroke-width="2.5" stroke-linejoin="round"/></svg>',
  grab:   '<svg viewBox="0 0 32 32"><path d="M9 16V8a2 2 0 014 0v6V5a2 2 0 014 0v9V6a2 2 0 014 0v9V10a2 2 0 014 0v9q0 9-8 9h-3q-6 0-8-8l-2-5a2 2 0 013-2z" fill="#f2c7a0" stroke="#14121a" stroke-width="2.3" stroke-linejoin="round"/></svg>',
};
const TOOLS = {
  punch:  { name: 'Punch',  power: 7,  scream: .35, words: ['POW!', 'BAM!', 'OOF!', 'WHAP!'] },
  kick:   { name: 'Kick',   power: 13, scream: .6,  words: ['KICK!', 'THWACK!', 'YEET!', 'OUCH!'] },
  bat:    { name: 'Bat',    power: 15, scream: .7,  words: ['HOME RUN!', 'CRACK!', 'FWACK!', 'DINGER!'] },
  hammer: { name: 'Hammer', power: 17, scream: .85, words: ['BONK!', 'SMASH!', 'CRUNCH!', 'WALLOP!'] },
  rocket: { name: 'Rocket', power: 20, scream: 1,   words: ['BOOM!', 'KABOOM!', 'BLAST!', 'WHOOSH!'] },
  laser:  { name: 'Laser',  power: 0,  scream: 0,   words: [] },
  zap:    { name: 'Zap',    power: 0,  scream: 0,   words: [] },
  grab:   { name: 'Grab',   power: 0,  scream: 0,   words: [] },
};
let tool = 'kick';
const tray = document.getElementById('tray');
Object.keys(TOOLS).forEach((key, i) => {
  const b = document.createElement('button');
  b.className = 'tile' + (key === tool ? ' active' : ''); b.dataset.tool = key;
  b.innerHTML = `<i>${i + 1}</i>${ICON[key]}<span class="n">${TOOLS[key].name}</span>`;
  b.addEventListener('click', () => selectTool(key));
  tray.appendChild(b);
});
function selectTool(key) {
  tool = key;
  [...tray.children].forEach(c => c.classList.toggle('active', c.dataset.tool === key));
}
addEventListener('keydown', e => {
  const keys = Object.keys(TOOLS); const n = parseInt(e.key, 10);
  if (n >= 1 && n <= keys.length) selectTool(keys[n - 1]);
  if (e.key === 'r' || e.key === 'R') resetAll();
});

/* ---------- score ---------- */
let score = 0, best = +(localStorage.getItem('ktk_best') || 0), combo = 1, lastHit = 0;
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), comboEl = document.getElementById('combo');
bestEl.textContent = best;
function addScore(base) {
  const now = performance.now();
  combo = (now - lastHit < 1400) ? Math.min(combo + 1, 20) : 1;
  lastHit = now;
  score += Math.round(base * combo);
  if (score > best) { best = score; try { localStorage.setItem('ktk_best', best); } catch (e) {} }
  scoreEl.textContent = score; bestEl.textContent = best; comboEl.textContent = 'x' + combo;
  comboEl.style.transform = 'scale(1.3) rotate(2deg)'; setTimeout(() => comboEl.style.transform = '', 120);
}
setInterval(() => { if (performance.now() - lastHit > 1500 && combo !== 1) { combo = 1; comboEl.textContent = 'x1'; } }, 300);

/* ---------- fx ---------- */
const fx = [];
function spawnFx(pos, color, size, life = 0.4) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .85 }));
  m.position.copy(pos); m.scale.setScalar(size * 0.3); scene.add(m);
  fx.push({ m, t: 0, life, size });
}
let shake = 0;
const POPCOL = ['#ffd23f', '#ff7a59', '#7cf0ff', '#ff9ef0'];
function popText(text, x, y) {
  const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  d.style.color = POPCOL[Math.floor(Math.random() * POPCOL.length)];
  document.body.appendChild(d); setTimeout(() => d.remove(), 850);
}

// laser beam objects
const beam = new THREE.Group();
const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 10), new THREE.MeshBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: .55 }));
const core = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
beam.add(glow, core); beam.visible = false; scene.add(beam);
const flare = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffb3b3, transparent: true, opacity: .9 }));
flare.visible = false; scene.add(flare);
const UP = new THREE.Vector3(0, 1, 0), zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

/* ---------- interaction ---------- */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
let lastPtr = null, laserOn = false, laserTick = 0, zapUntil = 0, zapTick = 0;
function setRay(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
function pickBody() {
  const hits = raycaster.intersectObjects(hitMeshes, false);
  return hits.length ? hits[0] : null;
}

function strike(hit, e) {
  const def = TOOLS[tool], body = hit.object.userData.body, p = hit.point;
  const rd = raycaster.ray.direction;
  const torso = parts[1].body;
  const sideways = THREE.MathUtils.clamp((torso.position.x - p.x) * 1.4, -1.2, 1.2) + (Math.random() - .5) * .4;
  const dir = new CANNON.Vec3(rd.x * 0.5 + sideways, 0.5 + Math.random() * .2, rd.z * 0.6 - 0.1);
  dir.normalize();

  if (tool === 'rocket') {
    const radius = 3;
    parts.forEach(pt => {
      const d = pt.body.position.vsub(new CANNON.Vec3(p.x, p.y, p.z));
      const dist = Math.max(d.length(), 0.2);
      if (dist < radius) {
        const fall = 1 - dist / radius;
        d.normalize(); d.y += 0.5; d.normalize();
        pt.body.applyImpulse(d.scale(def.power * pt.body.mass * (0.4 + fall)), new CANNON.Vec3(0, 0, 0));
      }
    });
    spawnFx(p, 0xff9a2e, 2.4, 0.5); spawnFx(p, 0xffe27a, 1.4, 0.35);
    shake = 0.5;
  } else {
    const local = new CANNON.Vec3(p.x - body.position.x, p.y - body.position.y, p.z - body.position.z);
    body.applyImpulse(dir.scale(def.power * body.mass), local);
    parts.forEach(pt => { if (pt.body !== body) pt.body.applyImpulse(dir.scale(def.power * pt.body.mass * 0.28), new CANNON.Vec3(0, 0, 0)); });
    spawnFx(p, tool === 'hammer' || tool === 'bat' ? 0xffd34d : 0xffffff, tool === 'hammer' ? 0.9 : 0.6, 0.25);
    shake = Math.max(shake, tool === 'hammer' || tool === 'bat' ? 0.3 : 0.15);
  }
  mouth.userData.t = 1;
  thud(def.power, tool);
  if (Math.random() < def.scream) scream(def.power / 12);
  addScore(def.power * (tool === 'rocket' ? 2 : 1));
  popText(def.words[Math.floor(Math.random() * def.words.length)], e.clientX, e.clientY);
}

// grab tool
const mouseBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, collisionFilterGroup: 0, collisionFilterMask: 0 });
mouseBody.addShape(new CANNON.Sphere(0.1)); world.addBody(mouseBody);
let grabC = null, grabPlane = null;
function startGrab(hit) {
  const body = hit.object.userData.body, p = hit.point;
  mouseBody.position.set(p.x, p.y, p.z);
  grabPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -p.z);
  grabC = new CANNON.PointToPointConstraint(mouseBody, new CANNON.Vec3(0, 0, 0), body,
    new CANNON.Vec3(p.x - body.position.x, p.y - body.position.y, p.z - body.position.z), 300);
  world.addConstraint(grabC);
  scream(0.5);
}
function moveGrab() {
  if (!grabC) return;
  const v = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(grabPlane, v)) mouseBody.position.set(
    THREE.MathUtils.clamp(v.x, -ROOM.w + .3, ROOM.w - .3), THREE.MathUtils.clamp(v.y, .3, ROOM.h - .3), v.z);
}
function endGrab() {
  if (!grabC) return;
  world.removeConstraint(grabC); grabC = null;
  const v = parts[1] ? parts[1].body.velocity.length() : 0;
  if (v > 6) { scream(Math.min(v / 10, 2)); addScore(Math.round(v)); }
}

function startZap(e) {
  zapUntil = performance.now() + 1500;
  zapSound(); scream(1.5); shake = 0.4; addScore(15);
  popText('ZZZAP!', e.clientX, e.clientY);
}

const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  ensureAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  lastPtr = { clientX: e.clientX, clientY: e.clientY };
  setRay(e); const hit = pickBody();
  if (tool === 'grab') { if (hit) { cv.setPointerCapture(e.pointerId); startGrab(hit); } return; }
  if (tool === 'laser') { laserOn = true; startLaserSound(); cv.setPointerCapture(e.pointerId); return; }
  if (tool === 'zap') { if (hit) startZap(e); return; }
  if (hit) strike(hit, e);
  else if (tool === 'rocket') {
    const v = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(zPlane, v)) strike({ object: { userData: { body: parts[1].body } }, point: v }, e);
  }
});
cv.addEventListener('pointermove', e => {
  lastPtr = { clientX: e.clientX, clientY: e.clientY };
  if (grabC) { setRay(e); moveGrab(); }
});
function release() { endGrab(); if (laserOn) { laserOn = false; stopLaserSound(); } }
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

/* ---------- UI ---------- */
function resetAll() {
  endGrab(); buildCharacter((Math.random() - .5) * 2, 0.3);
  score = 0; combo = 1; scoreEl.textContent = 0; comboEl.textContent = 'x1';
}
document.getElementById('btnReset').addEventListener('click', resetAll);
const sndBtn = document.getElementById('btnSound');
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn; sndBtn.classList.toggle('on', soundOn);
  sndBtn.textContent = soundOn ? 'Sound' : 'Muted';
  if (!soundOn) stopLaserSound();
});
const drawer = document.getElementById('drawer');
document.getElementById('btnCustom').addEventListener('click', () => drawer.classList.toggle('open'));
function rebuild() { endGrab(); buildCharacter(0, 0.3); }
[['cJacket', 'jacket'], ['cHair', 'hair'], ['cPants', 'pants'], ['cSkin', 'skin'], ['cCap', 'capColor']].forEach(([id, key]) =>
  document.getElementById(id).addEventListener('change', e => { look[key] = e.target.value; rebuild(); }));
[['sHair', 'hairStyle'], ['sBrow', 'brow']].forEach(([id, key]) =>
  document.getElementById(id).addEventListener('change', e => { look[key] = e.target.value; rebuild(); }));
[['kMustache', 'mustache'], ['kGoatee', 'goatee'], ['kGlasses', 'glasses'], ['kCap', 'cap']].forEach(([id, key]) =>
  document.getElementById(id).addEventListener('change', e => { look[key] = e.target.checked; rebuild(); }));

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  const k = camera.aspect < 1 ? 1.6 : 1;
  camBase.z = 8.2 * k; camBase.y = 2.6 + (k - 1) * 1.2;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const ZERO = new CANNON.Vec3(0, 0, 0), muzzle = new THREE.Vector3();
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();

  // laser: continuous beam that burns, pushes and levitates
  if (laserOn && lastPtr) {
    setRay(lastPtr);
    const hit = pickBody(); const target = new THREE.Vector3();
    let ok = false;
    if (hit) { target.copy(hit.point); ok = true; }
    else ok = !!raycaster.ray.intersectPlane(zPlane, target);
    if (ok) {
      muzzle.set(0, camera.position.y - 1.6, camera.position.z - 3);
      const dv = target.clone().sub(muzzle), len = dv.length(); dv.normalize();
      beam.visible = true; flare.visible = true;
      beam.position.copy(muzzle).addScaledVector(dv, len / 2); beam.scale.set(1, len, 1);
      beam.quaternion.setFromUnitVectors(UP, dv);
      flare.position.copy(target); flare.scale.setScalar(0.8 + Math.random() * 0.5);
      if (hit) {
        const b = hit.object.userData.body;
        b.applyImpulse(new CANNON.Vec3(dv.x * 0.6, 0.55, dv.z * 0.6).scale(b.mass * dt * 30), ZERO);
        shake = Math.max(shake, 0.1);
        laserTick += dt;
        if (laserTick > 0.12) {
          laserTick = 0; addScore(3);
          spawnFx(target, 0xff7a2e, 0.5, 0.2);
          if (mouth) mouth.userData.t = 1;
          if (Math.random() < 0.35) scream(0.8);
        }
      }
    } else { beam.visible = false; flare.visible = false; }
  } else { beam.visible = false; flare.visible = false; }

  // zap: whole body convulses
  if (now < zapUntil) {
    parts.forEach(p => p.body.applyImpulse(new CANNON.Vec3((Math.random() - .5) * 3, (Math.random() - .2) * 3, (Math.random() - .5) * 1.5).scale(p.body.mass * 0.5), ZERO));
    zapTick += dt;
    if (zapTick > 0.07) {
      zapTick = 0;
      const p = parts[Math.floor(Math.random() * parts.length)].body.position;
      spawnFx(new THREE.Vector3(p.x + (Math.random() - .5) * .3, p.y, p.z + .2), 0x7cf0ff, 0.5, 0.12);
    }
    if (mouth) mouth.userData.t = 1.2;
    shake = Math.max(shake, 0.12);
  }

  world.step(1 / 60, dt, 4);
  parts.forEach(p => { p.group.position.copy(p.body.position); p.group.quaternion.copy(p.body.quaternion); });

  if (mouth) {
    mouth.userData.t = Math.max(0, (mouth.userData.t || 0) - dt * 1.2);
    const t = Math.min(mouth.userData.t, 1.5); mouth.scale.set(1.3 - t * .3, .45 + t * 1.5, .6 + t * .4);
  }

  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt; const k = f.t / f.life;
    f.m.scale.setScalar(f.size * (0.3 + k)); f.m.material.opacity = Math.max(0, .85 * (1 - k));
    if (k >= 1) { scene.remove(f.m); f.m.geometry.dispose(); f.m.material.dispose(); fx.splice(i, 1); }
  }

  shake = Math.max(0, shake - dt * 1.6);
  camera.position.set(camBase.x + (Math.random() - .5) * shake, camBase.y + (Math.random() - .5) * shake, camBase.z);
  camera.lookAt(camLook);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 450);
</script>
